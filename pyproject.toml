[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prague"
version = "0.1.0"
description = "Marble street-world and Blender lighting research tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "Pillow", "scipy", "openai"]

[tool.setuptools.packages.find]
where = ["src"]
